# Local PostgreSQL for the surecachepg integration tests (`make pgtest`).
# Tests create and drop one database per test, so the user needs CREATEDB (D16).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: surecache
      POSTGRES_PASSWORD: surecache
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surecache -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
