name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# An explicit bash shell runs with -o pipefail, so `go test | tee` fails on test failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., surecachepg, promobs, examples/groups]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Root module has no dependencies (NFR-7)
        run: make deps-check
      - name: Test
        run: make test
      - name: Allocation tests (no race detector)
        run: make alloc

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: surecache
          POSTGRES_PASSWORD: surecache
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surecache -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      SURECACHE_PG_DSN: postgres://surecache:surecache@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test surecachepg and the PostgreSQL example
        run: |
          status=0
          (cd surecachepg && go test -race -json ./...) > test.json || status=1
          (cd examples/groups && go test -race -json ./...) >> test.json || status=1
          jq -j 'select(.Action == "output") | .Output' test.json
          exit "$status"
      - name: Fail on skipped tests
        run: |
          skipped="$(jq -r 'select(.Action == "skip" and .Test != null) | "\(.Package) \(.Test)"' test.json)"
          if [ -n "$skipped" ]; then
            echo "skipped tests (the DSN is set, so nothing may skip):"
            echo "$skipped"
            exit 1
          fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make vuln

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Benchmark head
        run: go test -run '^$' -bench . -benchmem -count 6 ./... | tee "$RUNNER_TEMP/head.txt"
      - name: Benchmark base
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          cd "$RUNNER_TEMP/base"
          # The base may predate the benchmarks (or the module); compare what exists.
          { go test -run '^$' -bench . -benchmem -count 6 ./... || echo "base benchmarks unavailable"; } | tee "$RUNNER_TEMP/base.txt"
      - name: Compare
        run: |
          {
            echo '## benchstat (base vs head, informational)'
            echo '```'
            benchstat "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
